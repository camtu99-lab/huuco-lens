<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#1b2150}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
#b{display:flex;align-items:center;gap:10px;border:1px solid #cfd6f5;background:#fff;color:#1b2150;border-radius:12px;padding:9px 16px;font-size:15px;font-weight:600;cursor:pointer}
#b:hover{background:#eef1ff}
#b.on{background:#fee2e2;border-color:#fca5a5}
#ic{width:20px;height:20px;color:#6366f1;flex:none}
#b.on #ic{color:#ef4444;animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.5);opacity:.5}}
#m{font-size:13px;color:#64748b}#m.err{color:#b42318}
body.c{height:46px;display:flex;align-items:flex-end}body.c #m{display:none}body.c #t{display:none}body.c.f #t{display:inline}body.c .row{gap:0;width:100%}
body.c #b{width:100%;height:40px;box-sizing:border-box;justify-content:center;padding:0 10px;font-size:14px;border-radius:10px}
</style></head><body>
<div class="row"><button id="b" type="button" title="Bấm để nói" aria-label="Bấm để nói"><svg id="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg><span id="t">Bấm để nói</span></button><span id="m">Nói xong tự dừng và chuyển thành chữ.</span></div>
<script>
// Giao thức thành phần Streamlit viết tay (không cần npm)
function send(type, extra) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: "streamlit:" + type }, extra || {}), "*"); }
let compact = false;
const lbl = () => compact ? "Nói" : "Bấm để nói";
function applyMode() { document.body.classList.toggle("c", compact); if (!rec_on) $("t").textContent = lbl(); send("setFrameHeight", { height: compact ? 46 : 56 }); }
window.addEventListener("message", e => { const d = e.data || {}; if (d.type === "streamlit:render") { const c = !!(d.args && d.args.compact); if (c !== compact) { compact = c; applyMode(); } } });
send("componentReady", { apiVersion: 1 }); send("setFrameHeight", { height: 56 });
const $ = id => document.getElementById(id);
const flash = t => { $("t").textContent = t; document.body.classList.add("f"); setTimeout(() => { document.body.classList.remove("f"); if (!rec_on) $("t").textContent = lbl(); }, 2200); };
const say = (t, err) => { $("m").textContent = t; $("m").className = err ? "err" : ""; };
let stream = null, rec = null, chunks = [], ctx = null, timer = null, rec_on = false, cancelled = false;

function stop(noSpeech) {
  if (!rec_on) return;
  cancelled = !!noSpeech; rec_on = false; clearInterval(timer);
  try { rec.stop(); } catch (e) { }
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (ctx) { try { ctx.close(); } catch (e) { } }
  $("b").classList.remove("on"); $("t").textContent = lbl();
}
async function start() {
  say("Đang mở micro…");
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { say("Không mở được micro. Hãy cho phép dùng micro cho trang này rồi thử lại.", true); send("setComponentValue", { value: { id: String(Date.now()), err: "mic" }, dataType: "json" }); return; }
  const AC = window.AudioContext || window.webkitAudioContext; ctx = new AC();
  const src = ctx.createMediaStreamSource(stream), an = ctx.createAnalyser(); an.fftSize = 1024; src.connect(an);
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
  rec = new MediaRecorder(stream, mime ? { mimeType: mime } : {}); chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = finish; rec.start(250); rec_on = true; cancelled = false;
  $("b").classList.add("on"); $("t").textContent = compact ? "Đang nghe…" : "Đang nghe… (bấm để dừng)"; say("Hãy nói, nói xong tôi tự dừng.");
  const buf = new Float32Array(an.fftSize), t0 = performance.now(); let noise = 0.004, spoke = false, last = 0;
  timer = setInterval(() => {
    an.getFloatTimeDomainData(buf); let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    const rms = Math.sqrt(s / buf.length), now = performance.now() - t0;
    if (now < 400) { noise = Math.min(0.02, Math.max(noise, rms)); return; }   // 0,4 giây đầu đo tiếng ồn nền
    if (rms > Math.max(0.015, noise * 2.5)) { spoke = true; last = now; }
    if (spoke && now - last > 1400) stop(false);          // im lặng 1,4 giây sau khi đã nói: tự dừng
    else if (!spoke && now > 7000) stop(true);            // không ai nói
    else if (now > 30000) stop(false);                    // tối đa 30 giây
  }, 80);
}
function decode(ab) { return new Promise((ok, no) => { const A = window.AudioContext || window.webkitAudioContext, c = new A(); c.decodeAudioData(ab, b => { c.close(); ok(b); }, e => no(e)); }); }
async function toWav16k(blob) {
  const ab = await blob.arrayBuffer(), buf = await decode(ab), O = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const off = new O(1, Math.max(1, Math.ceil(buf.duration * 16000)), 16000), s = off.createBufferSource(); s.buffer = buf; s.connect(off.destination); s.start();
  const pcm = (await off.startRendering()).getChannelData(0), n = pcm.length, out = new DataView(new ArrayBuffer(44 + n * 2));
  const w = (o, t) => { for (let i = 0; i < t.length; i++) out.setUint8(o + i, t.charCodeAt(i)); };
  w(0, "RIFF"); out.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
  out.setUint32(24, 16000, true); out.setUint32(28, 32000, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true); w(36, "data"); out.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, pcm[i])) * 32767, true);
  return new Uint8Array(out.buffer);
}
function b64(u8) { let s = ""; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); }
async function finish() {
  if (cancelled) { say("Không nghe thấy gì. Bấm lại rồi nói."); flash("Không nghe rõ"); return; }
  say("Đang chuyển thành chữ…");
  try {
    const wav = await toWav16k(new Blob(chunks, { type: (rec && rec.mimeType) || "audio/webm" }));
    send("setComponentValue", { value: { id: String(Date.now()) + Math.random().toString(36).slice(2, 6), wav: b64(wav) }, dataType: "json" });
  } catch (e) { say("Không xử lý được đoạn ghi âm: " + e, true); }
}
$("b").onclick = () => { if (rec_on) stop(false); else start(); };
</script></body></html>
